spring.application.name=backend

# Database Configuration
# Update these values for your environment
spring.datasource.url=jdbc:mysql://localhost:3306/BaBIBUS?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# JWT Configuration
# Replace with your own secret key in production
app.jwt.secret=your_secret_key_here
app.jwt.expiration-ms=86400000

# Server Configuration
server.port=8080
